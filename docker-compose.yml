services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: suppliesignal
      POSTGRES_PASSWORD: suppliesignal
      POSTGRES_DB: suppliesignal
    ports:
      - '5432:5432'
    volumes:
      - suppliesignal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U suppliesignal -d suppliesignal']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  suppliesignal_postgres:
